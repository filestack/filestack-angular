version: 2
updates:
  # npm dependencies (root workspace)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # No target-branch set: Dependabot targets the repository's default branch,
    # which avoids the stale-branch problem the old PRs suffered from.
    groups:
      # Roll all non-breaking updates into a single PR to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions versions current too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
